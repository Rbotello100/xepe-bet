name: Deploy to Cloud Run

# Auto-deploy on push to main. Manual run via workflow_dispatch.
# Requires Workload Identity Federation set up in GCP (see docs/gcp-setup.md).

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GCP_PROJECT_ID: dm-agents
  GCP_REGION: us-central1
  AR_REPOSITORY: mundial-betting
  SERVICE_NAME: mundial-betting

# Para usar Workload Identity Federation (sin keys de service account en GitHub)
permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Compute image tag
        id: tag
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          IMAGE_URI="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPOSITORY }}/${{ env.SERVICE_NAME }}"
          echo "image=${IMAGE_URI}:${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "image_latest=${IMAGE_URI}:latest" >> $GITHUB_OUTPUT

      - name: Build Docker image
        run: |
          docker build \
            --platform linux/amd64 \
            --build-arg NEXT_PUBLIC_SUPABASE_URL="${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY="${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
            --build-arg NEXT_PUBLIC_SITE_URL="${{ secrets.NEXT_PUBLIC_SITE_URL }}" \
            --build-arg NEXT_PUBLIC_SPORT_KEY="soccer_fifa_world_cup" \
            -t "${{ steps.tag.outputs.image }}" \
            -t "${{ steps.tag.outputs.image_latest }}" \
            .

      - name: Push Docker image
        run: |
          docker push "${{ steps.tag.outputs.image }}"
          docker push "${{ steps.tag.outputs.image_latest }}"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image="${{ steps.tag.outputs.image }}" \
            --region="${{ env.GCP_REGION }}" \
            --project="${{ env.GCP_PROJECT_ID }}" \
            --platform=managed \
            --allow-unauthenticated \
            --port=3000 \
            --memory=1Gi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=10 \
            --concurrency=80 \
            --timeout=60 \
            --set-env-vars="NODE_ENV=production,TZ=America/Santiago,NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL }},NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }},NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }},NEXT_PUBLIC_SPORT_KEY=soccer_fifa_world_cup" \
            --set-secrets="SUPABASE_SERVICE_ROLE_KEY=supabase-service-role-key:latest,THE_ODDS_API_KEY=the-odds-api-key:latest,CRON_SECRET=cron-secret:latest"

      - name: Show service URL
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.GCP_REGION }} \
            --project=${{ env.GCP_PROJECT_ID }} \
            --format='value(status.url)')
          echo "Deployed to: $URL"
          echo "url=$URL" >> $GITHUB_STEP_SUMMARY
