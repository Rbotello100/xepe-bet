name: Sync scores cron

# Dispara /api/cron/sync-scores 4 veces al día (mas Vercel cron = 5 total)
# para liquidar partidos terminados con latencia max ~3-4h.
#
# Horarios (UTC con minutos non-round para escapar peak hour de GH Actions):
#   - 13:07 UTC ≈ 09:07 AM Chile  (cubierto tambien por Vercel cron 13:00)
#   - 16:12 UTC ≈ 12:12 PM Chile
#   - 21:18 UTC ≈ 17:18 PM Chile
#   - 01:23 UTC ≈ 21:23 PM Chile (del dia anterior CL)
#
# Costo: si NO hay matches pending en BD, syncFinishedScores early-returns
# y la call NO toca la API → 0 creditos. Solo cobra (2 creditos) cuando hay
# un partido recien terminado por sincronizar. Total proyectado Mundial:
# ~150 creditos. Plan 20K cubre con holgura.
#
# Endpoint: /api/cron/sync-scores con Bearer CRON_SECRET.
# Idempotente (UPDATE con guard status='pending').

on:
  schedule:
    - cron: "7 13 * * *"   # 09:07 AM Chile (UTC-4)
    - cron: "12 16 * * *"  # 12:12 PM Chile
    - cron: "18 21 * * *"  # 17:18 PM Chile
    - cron: "23 1 * * *"   # 21:23 PM Chile (del dia anterior CL en UTC)
  workflow_dispatch: {}

jobs:
  trigger-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Hit sync-scores endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: https://xepe-bet-botellorodrigo97-3285s-projects.vercel.app
        run: |
          set -e
          echo "→ Disparando sync-scores en ${SITE_URL}"
          STATUS=$(curl -sS -o /tmp/resp.json -w "%{http_code}" \
            -X POST "${SITE_URL}/api/cron/sync-scores" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            --max-time 240 || echo "000")
          echo "HTTP ${STATUS}"
          cat /tmp/resp.json | head -c 600 || true
          echo ""
          if [ "${STATUS}" != "200" ]; then
            echo "::warning::Cron devolvio HTTP ${STATUS}, revisar el endpoint"
            exit 1
          fi
