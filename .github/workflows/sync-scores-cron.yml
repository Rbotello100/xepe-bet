name: Sync scores cron (DISABLED)

# DESHABILITADO 2026-07-02: The Odds API entrega solo el score final
# (incluye ET, excluye penales), pero para eliminatorias necesitamos el
# score al minuto 90 (convencion de bookmaker). A partir de cuartos, los
# partidos se resuelven a mano desde /admin.
#
# Para reactivar: descomentar el bloque `schedule` de abajo.
# workflow_dispatch queda disponible para disparar manualmente si hace falta.

on:
  # schedule:
  #   - cron: "7 13 * * *"   # 09:07 AM Chile (UTC-4)
  #   - cron: "12 16 * * *"  # 12:12 PM Chile
  #   - cron: "18 21 * * *"  # 17:18 PM Chile
  #   - cron: "23 1 * * *"   # 21:23 PM Chile (del dia anterior CL en UTC)
  workflow_dispatch: {}

jobs:
  trigger-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Hit sync-scores endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: https://xepe-bet.vercel.app
        run: |
          set -e
          echo "→ Disparando sync-scores en ${SITE_URL}"
          STATUS=$(curl -sS -o /tmp/resp.json -w "%{http_code}" \
            -X POST "${SITE_URL}/api/cron/sync-scores" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            --max-time 240 || echo "000")
          echo "HTTP ${STATUS}"
          cat /tmp/resp.json | head -c 600 || true
          echo ""
          if [ "${STATUS}" != "200" ]; then
            echo "::warning::Cron devolvio HTTP ${STATUS}, revisar el endpoint"
            exit 1
          fi
